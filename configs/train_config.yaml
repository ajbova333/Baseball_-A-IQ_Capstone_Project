data:
  data_path: "data/processed/panel.csv"
  test_fraction: 0.2

mlflow:
  experiment_name: "baseball_aiq_avg_prediction"
  tracking_uri: "sqlite:///mlflow.db"

models:
  linear_regression:
    params: {}
  random_forest:
    params:
      n_estimators: 200
      max_depth: 10
      random_state: 42
  gradient_boosting:
    params:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3
      random_state: 42
tuning:
  linear_regression:
    fit_intercept: [true, false]
  random_forest:
    n_estimators: [100, 300]
    max_depth: [5, 15, null]
  gradient_boosting:
    n_estimators: [100, 300]
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [2, 3, 5]